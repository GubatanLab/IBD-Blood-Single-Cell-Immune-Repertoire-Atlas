definitions:
  datasets:
    bcr_light_cd_vs_control:
      format: AIRR
      params:
        import_empty_aa_sequences: false
        import_empty_nt_sequences: true
        import_illegal_characters: false
        import_out_of_frame: false
        import_productive: true
        import_unknown_productivity: true
        import_with_stop_codon: false
        is_repertoire: true
        label_columns: null
        metadata_file: C:/path/to/private-immuneml-workspace/chain_bcr_immuneml/airr_input/bcr_light/metadata_cd_vs_control.csv
        paired: false
        path: C:/path/to/private-immuneml-workspace/chain_bcr_immuneml/airr_input/bcr_light/repertoires
        region_type: IMGT_CDR3
        separator: "\t"
