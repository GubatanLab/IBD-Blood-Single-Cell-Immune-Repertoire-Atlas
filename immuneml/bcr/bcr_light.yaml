        path: C:/path/to/private-immuneml-workspace/chain_bcr_immuneml/airr_input/bcr_light/repertoires
        region_type: IMGT_CDR3
        separator: "\t"
  encodings:
    k3_aa:
      KmerFrequency:
        k: 3
        k_left: 1
        k_right: 1
        max_gap: 0
        min_gap: 0
        name: k3_aa
        normalization_type: relative_frequency
        reads: unique
        region_type: imgt_cdr3
        scale_to_unit_variance: true
        scale_to_zero_mean: false
        sequence_encoding: CONTINUOUS_KMER
        sequence_type: AMINO_ACID
    k4_aa:
      KmerFrequency:
        k: 4
        k_left: 1
        k_right: 1
        max_gap: 0
        min_gap: 0
        name: k4_aa
        normalization_type: relative_frequency
        reads: unique
        region_type: imgt_cdr3
        scale_to_unit_variance: true
        scale_to_zero_mean: false
        sequence_encoding: CONTINUOUS_KMER
        sequence_type: AMINO_ACID
    k3_nt:
