      model_selection_cv: false
      model_selection_n_folds: -1
  motifs: {}
  preprocessing_sequences: {}
  signals: {}
  simulations: {}
instructions:
  bcr_light_cd_vs_control_k3_aa:
    type: TrainMLModel
    settings:
    - encoding: k3_aa
      ml_method: logistic_regression
      preprocessing: null
    assessment:
      split_strategy: random
      split_count: 5
      training_percentage: 0.7
    selection:
      split_strategy: random
      split_count: 1
      training_percentage: 0.7
    labels:
    - Diagnosis1
    strategy: GridSearch
    metrics:
    - auc
    - balanced_accuracy
    - f1_macro
    optimization_metric: balanced_accuracy
    number_of_processes: 1
    reports: []
    dataset: bcr_light_cd_vs_control
    refit_optimal_model: false
